apiVersion: apps/v1
kind: Deployment
metadata:
  name: process-state-demo
  namespace: ops-sandbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: process-state-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: process-state-demo
    spec:
      containers:
        - name: process-state-demo
          image: autonomous-ops-process-state:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: process-state-demo
  namespace: ops-sandbox
spec:
  selector:
    app.kubernetes.io/name: process-state-demo
  ports:
    - name: http
      port: 8080
      targetPort: http
